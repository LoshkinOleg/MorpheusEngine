name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore unit tests
        run: dotnet restore dotnet/tests/MorpheusEngine.Tests.Unit/MorpheusEngine.Tests.Unit.csproj

      - name: Restore integration tests
        run: dotnet restore dotnet/tests/MorpheusEngine.Tests.Integration/MorpheusEngine.Tests.Integration.csproj

      - name: Unit tests
        run: dotnet test dotnet/tests/MorpheusEngine.Tests.Unit/MorpheusEngine.Tests.Unit.csproj --configuration Release --no-restore --logger "trx;LogFileName=unit.trx"

      - name: Integration tests
        run: dotnet test dotnet/tests/MorpheusEngine.Tests.Integration/MorpheusEngine.Tests.Integration.csproj --configuration Release --no-restore --logger "trx;LogFileName=integration.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            **/unit.trx
            **/integration.trx
